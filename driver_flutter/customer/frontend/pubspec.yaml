name: frontend
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.7
  flutter_secure_storage: ^9.2.2
  dio: ^5.5.0
  geolocator: ^11.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  rxdart: ^0.27.7
  http: ^1.2.1
  url_launcher: ^6.3.2
  socket_io_client: ^3.1.6
  intl: ^0.20.3

dev_dependencies:
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/gorush_app_icon.png"
